<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics - Year 5 Exam Practice (Htet Aung Khant)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --success-color: #10b981;
            --error-color: #ef4444;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 14px;
        }

        h1 {
            font-size: 20px;
            color: var(--primary-color);
            margin: 0;
        }

        .progress-bar {
            height: 8px;
            width: 100%;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }

        .badge-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .badge.type-badge {
            background: #fef3c7;
            color: #92400e;
        }

        .tool-hint {
            background: #fffbe3;
            border: 1px solid #fde047;
            color: #854d0e;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .question-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background: #eff6ff;
            border-color: var(--primary-color);
        }

        .option-btn.correct {
            background: #d1fae5 !important;
            border-color: var(--success-color) !important;
            color: #065f46;
        }

        .option-btn.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }

        /* Short answer / Fill in the blank box */
        .text-input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .text-input-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .text-input-box input:focus {
            border-color: var(--primary-color);
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .explanation-box {
            background: #f0fdf4;
            border-left: 4px solid var(--success-color);
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            color: #166534;
        }

        .next-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: none;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            color: var(--primary-color);
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link">⬅️ Back to Menu</a>
            <h1>Year 5 Mathematics Test Prep</h1>
        </div>

        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-box">
            <div class="badge-container">
                <span id="unit-tag" class="badge">Unit Tag</span>
                <span id="type-tag" class="badge type-badge">Question Type</span>
            </div>
            
            <div id="tool-hint" class="tool-hint" style="display: none;"></div>
            <div id="question-title" class="question-title"></div>

            <!-- Multiple Choice & True/False Container -->
            <div id="options-grid" class="options-grid"></div>

            <!-- Short Answer / Fill in Blanks Container -->
            <div id="input-container" class="text-input-box" style="display: none;">
                <input type="text" id="user-answer-input" placeholder="Type your answer here (e.g. 3/4 or 30 cm)...">
                <button class="submit-btn" onclick="checkShortAnswer()">Submit Answer</button>
            </div>

            <div id="explanation-box" class="explanation-box"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="result-screen">
            <h2>Awesome Job, Htet Aung Khant! 🎉</h2>
            <p id="score-text" style="font-size: 18px; color: #475569; margin-bottom: 25px;"></p>
            <a href="index.html" style="text-decoration: none;">
                <button class="next-btn" style="display: block;">Back to Main Menu</button>
            </a>
        </div>
    </div>
