<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 5 Geography Practice</title>

<style>
:root {
  --primary: #246b56;
  --primary-light: #e6f4ed;
  --background: #f4f7f5;
  --text: #25332d;
  --white: #ffffff;
  --correct: #18794e;
  --wrong: #c0392b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--text);
  line-height: 1.6;
}

header {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 28px 16px;
}

header h1 {
  margin: 0 0 8px;
  font-size: clamp(24px, 5vw, 36px);
}

header p {
  margin: 0;
}

.container {
  width: min(100% - 28px, 900px);
  margin: 24px auto;
}

.panel,
.question-card,
.result-card {
  background: var(--white);
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 3px 14px rgba(0,0,0,.06);
  margin-bottom: 20px;
}

h2, h3 {
  margin-top: 0;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

select,
input[type="text"],
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5ce;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px 5px 5px 0;
  background: var(--primary);
  color: white;
}

button:hover {
  opacity: .9;
}

button.secondary {
  background: #e7ece8;
  color: var(--text);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.question-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: #5c6d63;
  font-size: 14px;
}

.question-text {
  font-size: 19px;
  font-weight: bold;
  margin: 18px 0;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  margin: 9px 0;
  border: 1px solid #dce5de;
  border-radius: 9px;
  cursor: pointer;
  font-weight: normal;
}

.option:hover {
  background: var(--primary-light);
}

.option input {
  margin-top: 5px;
}

.feedback {
  margin-top: 16px;
  padding: 12px;
  border-radius: 8px;
  display: none;
}

.feedback.correct {
  display: block;
  color: var(--correct);
  background: #e7f7ed;
}

.feedback.wrong {
  display: block;
  color: var(--wrong);
  background: #fff0ee;
}

.progress-wrap {
  background: #dfe7e1;
  height: 9px;
  border-radius: 10px;
  overflow: hidden;
  margin: 12px 0;
}

.progress-bar {
  height: 100%;
  background: #3b9a71;
  width: 0;
  transition: width .2s;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 20px;
}

#result {
  display: none;
}

.score {
  font-size: 36px;
  font-weight: bold;
  color: var(--primary);
}

.small {
  color: #65746b;
  font-size: 14px;
}

footer {
  text-align: center;
  padding: 24px 12px;
  color: #65746b;
}

.match-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: center;
  margin: 12px 0;
}

@media (max-width: 500px) {
  .panel, .question-card, .result-card {
    padding: 16px;
  }

  .match-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🌍 Year 5 Geography</h1>
  <p>Oxford Geography Book 5 · Practice and Learn</p>
</header>

<main class="container">

  <section class="panel">
    <h2>Choose Your Practice</h2>

    <div class="controls">
      <div>
        <label for="topic">Topic</label>
        <select id="topic">
          <option value="all">All Topics</option>
          <option value="deserts">Deserts</option>
          <option value="rainforest">Tropical Rainforests</option>
          <option value="water">Water and Drought</option>
          <option value="transport">Transport and Roads</option>
        </select>
      </div>

      <div>
        <label for="type">Question Type</label>
        <select id="type">
          <option value="all">All Question Types</option>
          <option value="mcq">Multiple Choice</option>
          <option value="tf">True or False</option>
          <option value="fill">Fill in the Blanks</option>
          <option value="short">Short Questions</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button onclick="startPractice()">Start Practice</button>
      <button class="secondary" onclick="showAllAnswers()">Show Answer Key</button>
    </div>

    <p class="small">
      Read each question carefully. Submit your answer to receive feedback.
    </p>
  </section>

  <section id="practice" class="question-card" style="display:none">
    <div class="question-top">
      <span id="question-category"></span>
      <span id="question-count"></span>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progress"></div>
    </div>

    <div id="question-text" class="question-text"></div>
    <div id="answer-area"></div>
    <div id="feedback" class="feedback"></div>

    <div class="actions">
      <button id="check-btn" onclick="checkAnswer()">Check Answer</button>
      <button id="next-btn" onclick="nextQuestion()" style="display:none">Next Question →</button>
      <button class="secondary" onclick="endPractice()">Finish</button>
    </div>
  </section>

  <section id="result" class="result-card">
    <h2>🎉 Practice Complete!</h2>
    <p>Your score:</p>
    <div class="score" id="final-score"></div>
    <p id="result-message"></p>
    <button onclick="startPractice()">Try Again</button>
  </section>

  <section id="answer-key" class="panel" style="display:none">
    <h2>Answer Key</h2>
    <div id="answer-key-content"></div>
    <button class="secondary" onclick="document.getElementById('answer-key').style.display='none'">
      Close Answer Key
    </button>
  </section>

</main>

<footer>
  Year 5 Geography Practice · Learn at your own pace 🌱
</footer>

};

const typeNames = {

  short: "Short Question"
};

function shuffle(array) {
  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function startPractice() {
  const selectedTopic = document.getElementById("topic").value;
  const selectedType = document.getElementById("type").value;

  practiceQuestions = questions.filter(q => {
    const topicMatches = selectedTopic === "all" || q.topic === selectedTopic;
    const typeMatches = selectedType === "all" || q.type === selectedType;
    return topicMatches && typeMatches;
  });

  if (practiceQuestions.length === 0) {
    alert("No questions found for this selection.");
    return;
  }

  practiceQuestions = shuffle(practiceQuestions);
  currentIndex = 0;
  score = 0;
  answered = false;
  answerRecords = [];

  document.getElementById("practice").style.display = "block";
  document.getElementById("result").style.display = "none";
  document.getElementById("answer-key").style.display = "none";

  renderQuestion();

  document.getElementById("practice").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function renderQuestion() {

      label.className = "option";

      radio
